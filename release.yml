name: Build and Release Macass

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make executable
        run: chmod +x install.sh

      - name: Package Executor
        run: |
          # Assuming your source app is named Macass.app and located in the root or a specific folder
          # Adjust 'Macass.app' to match your actual project structure
          if [ -d "Macass.app" ]; then
            zip -r Macass.app.zip Macass.app
          else
            # Fallback: Zip everything if no single .app exists
            zip -r Macass.app.zip .
          fi

      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./Macass.app.zip
          asset_name: Macass.app.zip
          asset_content_type: application/zip
